name: Deploy Dashboard to GitHub Pages

on:
  push:
    branches: [principal]
    paths:
      - 'Dashboard/**'
  # La Action semanal publica con GITHUB_TOKEN, y ese push no dispara otros
  # workflows: por eso se despliega también cuando ella termina.
  workflow_run:
    workflows: ["Actualizar datos"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p site
          cp Dashboard/andre_mundial2026.html site/index.html
          if [ -f Dashboard/team_state.json ]; then cp Dashboard/team_state.json site/; fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
